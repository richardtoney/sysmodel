name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  PIP_CACHE_DIR: ${{ github.workspace }}/.pip-cache

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[graph,dev]" --quiet
      - run: ruff check sysmodel/ tests/
      - run: mypy sysmodel/

  test:
    name: Test (with Kuzu)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[graph,dev]" --quiet
      - run: pytest --cov=sysmodel --cov-report=xml --cov-fail-under=90
      - uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          files: coverage.xml
          fail_ci_if_error: false

  test-no-kuzu:
    name: Test (without Kuzu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]" --quiet
      - run: pytest tests/ -k "not test_graph" --cov=sysmodel --cov-report=term-missing --override-ini="addopts="

  docs:
    name: Build Docs
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[graph,dev]" --quiet
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy-docs:
    name: Deploy Docs
    needs: docs
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [lint, test, test-no-kuzu]
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install build --quiet
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
