[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sysmodel"
dynamic = ["version"]
description = "Model and query software systems and cloud infrastructure as Python."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = [
    "systems modeling", "architecture", "cloud", "infrastructure",
    "graph", "pydantic", "kuzu", "textual"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "glom>=23.0",
    "textual>=0.60",
]

[project.optional-dependencies]
graph = ["kuzu>=0.4"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.9",
    "ruff>=0.4",
    "pre-commit>=3.7",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[project.urls]
Homepage = "https://github.com/richardtoney/sysmodel"
Repository = "https://github.com/richardtoney/sysmodel"
Documentation = "https://richardtoney.github.io/sysmodel"
"Bug Tracker" = "https://github.com/richardtoney/sysmodel/issues"
Changelog = "https://github.com/richardtoney/sysmodel/blob/main/CHANGELOG.md"

[project.scripts]
sysmodel = "sysmodel.tui:cli_entry"

[tool.hatch.version]
path = "sysmodel/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["sysmodel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=sysmodel --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
omit = ["sysmodel/tui.py", "tests/*"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
